server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida (documentos PDF/imagenes)
    client_max_body_size 30m;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend (nombre del servicio en la red docker)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # HTML nunca se cachea (para que los cambios lleguen siempre)
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~ \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Assets estáticos cacheables (logo, iconos, etc)
    location ~* \.(png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Service Worker: sin cache (siempre la versión más reciente)
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Manifest: sin cache (responsive a cambios)
    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}
